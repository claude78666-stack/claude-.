<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#16324a"/>
      <stop offset="100%" stop-color="#0a1724"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3d58a"/>
      <stop offset="100%" stop-color="#c99a3b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <!-- thin ring, keeps inside the circular crop -->
  <circle cx="400" cy="400" r="300" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.9"/>
  <!-- archive arch / open book mark -->
  <path d="M290 250 Q400 190 510 250" fill="none" stroke="url(#gold)" stroke-width="10" stroke-linecap="round"/>
  <!-- monogram -->
  <text x="400" y="470" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="230" font-weight="700" fill="#f5f1e8" letter-spacing="-6">MA</text>
  <!-- underline -->
  <line x1="300" y1="520" x2="500" y2="520" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
  <text x="400" y="580" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="32" fill="#e7c879" letter-spacing="8">MENTOR ARCHIVE</text>
</svg>
